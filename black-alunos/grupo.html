    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Open Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    main{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:32px 20px;position:relative;overflow:hidden;text-align:center}
    main::before{content:"";position:absolute;width:560px;height:560px;left:50%;top:38%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(37,211,102,.14),transparent 65%);pointer-events:none}

<body>

  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TC2WPHZ9"

  <main>
    <div class="box">
      <img class="logo" src="/black-alunos/assets/img/logo-black-contabil-vitalicia.png?v=20261019b" width="300" height="72" alt="Black Contábil Vitalícia">
      <h1>Estamos te levando para o <em>grupo VIP</em>…</h1>
      <p>Em instantes você será redirecionado para o grupo de WhatsApp. É lá que enviaremos todas as informações.</p>
      <div class="count" id="contagem" aria-live="off">5</div>
      <div class="track" role="progressbar" aria-label="Redirecionando para o grupo" aria-valuemin="0" aria-valuemax="100"><span class="fill" id="barra"></span></div>
      <a class="btn" id="grupo" href="https://chat.whatsapp.com/BW0kHJdkvMLCwLrH6RlNNa">Entrar agora no grupo</a>
      <p class="hint">Se nada acontecer, toque no botão acima.</p>
    </div>
  </main>

  <script>
  (function () {
    var GRUPO_VIP = 'https://chat.whatsapp.com/BW0kHJdkvMLCwLrH6RlNNa';
    var ESPERA = 5000; // ms que a pessoa fica na página
    var FORM_ID = 'sk-bf26-redirecionamento-grupo';
    var ENDPOINT = 'https://n8n.grupohbdigital.com.br/webhook/black-do-milhao';
    var FUSO = 'America/Sao_Paulo';

    /* ---------- UTMs e ids de clique: mesmo formato e mesma chave das LPs ---------- */
    var FIXO = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','utm_id',
                'fbclid','gclid','gbraid','wbraid','ttclid','msclkid','src','sck'];
    var CHAVE = 'sk-bf26-rastreio', VALIDADE = 30 * 86400000;

    function daUrl() {
      var achados = {};
      new URLSearchParams(location.search).forEach(function (valor, chave) {
        var nome = chave.toLowerCase();
        if (valor && (nome.indexOf('utm_') === 0 || FIXO.indexOf(nome) > -1)) achados[nome] = valor;
      });
      return achados;
    }
    function rastreio() {
      var r = daUrl();
      try {
        if (Object.keys(r).length) {
          localStorage.setItem(CHAVE, JSON.stringify({ salvo_em: Date.now(), rastreio: r }));
        } else {
          var s = JSON.parse(localStorage.getItem(CHAVE));
          if (s && Date.now() - s.salvo_em < VALIDADE) r = s.rastreio;
        }
      } catch (e) {}
      return r;
    }

    /* ---------- Lead: mesmo evento do formulário das LPs, o GTM dispara o pixel ---------- */
    var utms = rastreio();
    var evento = { event: 'generate_lead', form_id: FORM_ID, form_local: 'redirecionamento', page_url: location.href };
    FIXO.forEach(function (k) { evento[k] = utms[k] || ''; });
    Object.keys(utms).forEach(function (k) { evento[k] = utms[k]; });
    (window.dataLayer = window.dataLayer || []).push(evento);

    /* ---------- Webhook (n8n): mesmo payload das capturas, sem e-mail e WhatsApp ---------- */
    var agora = new Date();
    var payload = {
      email: '', whatsapp: '',
      form_id: FORM_ID,
      form_nome: 'Black Contábil Vitalícia | Redirecionamento ao grupo',
      form_local: 'redirecionamento',
      data: agora.toLocaleDateString('pt-BR', { timeZone: FUSO }),
      hora: agora.toLocaleTimeString('pt-BR', { timeZone: FUSO, hour12: false }),
      enviado_em: agora.toISOString(),
      page_url: location.href
    };
    FIXO.forEach(function (k) { payload[k] = utms[k] || ''; });
    Object.keys(utms).forEach(function (k) { payload[k] = utms[k]; });
    try {
      // keepalive: o envio termina mesmo se a pessoa clicar e sair antes dos 5s
      fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), keepalive: true }).catch(function () {});
    } catch (e) {}

    /* ---------- Contagem e redirecionamento ---------- */
    var contagem = document.getElementById('contagem');
    var barra = document.getElementById('barra');
    var restante = Math.round(ESPERA / 1000);
    var ir = function () { location.replace(GRUPO_VIP); };

    document.getElementById('grupo').addEventListener('click', function (ev) {
      ev.preventDefault();
      ir();
    });
    requestAnimationFrame(function () { requestAnimationFrame(function () { barra.className = 'fill run'; }); });
    var tick = setInterval(function () {
      restante -= 1;
      if (restante > 0) contagem.textContent = restante;
      else clearInterval(tick);
    }, 1000);
    setTimeout(ir, ESPERA);
  })();
  </script>
